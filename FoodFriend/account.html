<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFriend - Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="account-page">
    <div class="account-container">
      <div class="account-food">
        <div class="account-brand">FoodFriend</div>

        <div class="account-food-text">
          <h1>Good food starts with a good friend.</h1>
          <p>
            Log in to access your saved preferences, favorite recipes, and
            personalized AI recommendations.
          </p>
        </div>
      </div>

      <div class="account-box">
        <div class="account-header">
          <h2>Welcome Back!</h2>
          <p>Log in to continue your food journey.</p>
        </div>

        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            required
          />

          <label for="loginPassword">Password</label>
          <div class="password-box">
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              onclick="togglePassword('loginPassword', this)"
            >
              Show
            </button>
          </div>

          <button class="account-button" type="submit">Login</button>
        </form>

        <p class="account-switch">
          Don't have an account?
          <a
            href="register.html"
            style="color: var(--green); font-weight: 700; text-decoration: none"
            >Register</a
          >
        </p>

        <a href="index.html" class="back-home"> ← Back to FoodFriend </a>
      </div>
    </div>

    <script type="module" src="acc.js"></script>
  </body>
</html>
