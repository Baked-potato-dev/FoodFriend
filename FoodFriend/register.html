<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFriend - Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="account-page">
    <div class="account-container">
      <div class="account-food">
        <div class="account-brand">FoodFriend</div>
        <div class="account-food-text">
          <h1>Start your tasty journey today.</h1>
          <p>
            Create an account to save your favorite recipes and personalized
            preferences.
          </p>
        </div>
      </div>

      <div class="account-box">
        <div class="account-header">
          <h2>Create Account</h2>
          <p>Join FoodFriend to get personalized food suggestions.</p>
        </div>

        <form id="registerForm">
          <label>Name</label>
          <input type="text" placeholder="Your name" required />

          <label>Email</label>
          <input
            type="email"
            id="regEmail"
            placeholder="you@example.com"
            required
          />

          <label>Password</label>
          <div class="password-box">
            <input
              type="password"
              id="regPassword"
              placeholder="Create a password"
              minlength="6"
              required
            />
            <button type="button" onclick="togglePassword('regPassword', this)">
              Show
            </button>
          </div>

          <button class="account-button" type="submit">Create Account</button>
        </form>

        <p class="account-switch">
          Already have an account?
          <a
            href="account.html"
            style="color: var(--green); font-weight: 700; text-decoration: none"
            >Login</a
          >
        </p>

        <a href="index.html" class="back-home"> ← Back to FoodFriend </a>
      </div>
    </div>

    <script type="module" src="acc.js"></script>
  </body>
</html>
